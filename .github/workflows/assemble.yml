name: assemble
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html
        run: |
          set -euo pipefail
          if [ -d _parts ]; then
            cat _parts/*.html > index.html
            rm -rf _parts
            rm -f .github/workflows/assemble.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "build: assemble index.html from parts"
            git push
          else
            echo "no _parts directory; nothing to do"
          fi
