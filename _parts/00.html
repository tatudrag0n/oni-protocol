<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070512">
<title>鬼狩り // ONI PROTOCOL</title>
<style>
:root{
  --bg:#070512;--surface:rgba(16,12,36,.78);--surface2:rgba(24,17,50,.94);
  --ink:#fff2ec;--dim:#a89fc4;--faint:#6f6694;
  --pink:#ff4d8d;--pink2:#ff9ec7;--red:#ff3b2f;--cyan:#2ee6ff;--amber:#ffb648;--jade:#3ef2a0;--violet:#9d6bff;
  --fd:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','MS PMincho',serif;
  --fn:'Consolas','SF Mono','Menlo','Courier New',monospace;
  --fu:'Hiragino Kaku Gothic ProN','Yu Gothic UI','Meiryo','Noto Sans JP',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--pink) rgba(20,14,42,.7)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:rgba(20,14,42,.7);border-radius:8px}
*::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--pink),var(--violet));border-radius:8px;border:2px solid rgba(20,14,42,.7)}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,var(--cyan),var(--pink))}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--fu);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:var(--fu);color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{position:fixed;inset:0}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#070512}
#scan{position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#booterr{position:absolute;left:0;right:0;top:0;z-index:200;display:none;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;
  padding:9px 16px;background:rgba(60,8,14,.96);border-bottom:2px solid var(--red);font-size:12px;color:#ffd7d2}
#booterr.on{display:flex}
#booterr b{font-family:var(--fn);letter-spacing:.2em;color:var(--red)}
#booterr code{font-family:var(--fn);font-size:11px;color:#ffb3ac;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#booterr button{border:1px solid var(--red);padding:5px 14px;font-size:11px;font-weight:700;letter-spacing:.15em;color:#ffd7d2}
#hud{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;transition:opacity .35s}
body[data-s="PLAY"] #hud,body[data-s="PAUSE"] #hud,body[data-s="UP"] #hud,body[data-s="DYING"] #hud{opacity:1}
.panel{background:var(--surface);border:1px solid rgba(46,230,255,.22);position:relative;padding:9px 13px}
.panel::before,.panel::after{content:"";position:absolute;width:11px;height:11px}
.panel::before{top:-1px;left:-1px;border-top:2px solid var(--cyan);border-left:2px solid var(--cyan)}
.panel::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--pink);border-right:2px solid var(--pink)}
#tl{position:absolute;top:14px;left:14px;display:flex;flex-direction:column;gap:7px}
#wavep{display:flex;align-items:baseline;gap:11px}
.lbl{font-size:10px;letter-spacing:.28em;color:var(--dim)}
#wnum{font-family:var(--fn);font-weight:700;font-size:32px;line-height:1;color:var(--pink2);text-shadow:0 0 14px rgba(255,77,141,.7)}
#wleft{font-family:var(--fn);font-weight:700;font-size:19px;color:var(--cyan)}
#scorep{display:flex;flex-direction:column;gap:2px;min-width:172px}
#sval{font-family:var(--fn);font-weight:700;font-size:26px;line-height:1;text-shadow:0 0 10px rgba(46,230,255,.45)}
#bline{font-size:11px;color:var(--faint)}#bval{color:var(--amber);font-family:var(--fn)}
#bossw{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:min(540px,56vw);display:none;text-align:center}
#bossw.on{display:block}
#bname{font-family:var(--fd);font-weight:800;font-size:18px;letter-spacing:.3em;color:var(--red);text-shadow:0 0 16px rgba(255,59,47,.8);margin-bottom:5px}
#btrack{height:12px;background:rgba(10,7,26,.8);border:1px solid rgba(255,59,47,.5);position:relative;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#blag{position:absolute;inset:1px auto 1px 1px;width:100%;background:rgba(255,242,236,.7)}
#bbar{position:absolute;inset:1px auto 1px 1px;width:100%;background:linear-gradient(90deg,var(--red),var(--pink),var(--violet));box-shadow:0 0 12px rgba(255,77,141,.8)}
#cross{position:absolute;left:50%;top:50%;width:0;height:0;--g:8px;opacity:0}
body[data-s="PLAY"] #cross{opacity:1}
#cross.ads .ch{opacity:.22}
.ch{position:absolute;background:var(--cyan);box-shadow:0 0 6px rgba(46,230,255,.9)}
.ch.t{width:2px;height:9px;left:-1px;bottom:var(--g)}.ch.b{width:2px;height:9px;left:-1px;top:var(--g)}
.ch.l{height:2px;width:9px;top:-1px;right:var(--g)}.ch.r{height:2px;width:9px;top:-1px;left:var(--g)}
.ch.d{width:3px;height:3px;left:-1.5px;top:-1.5px;border-radius:50%;background:var(--pink2)}
#hm,#km{position:absolute;left:0;top:0;opacity:0}
#hm i,#km i{position:absolute;width:2px;height:9px;background:#fff;box-shadow:0 0 6px #fff;display:block}
#km i{background:var(--pink);height:13px;box-shadow:0 0 9px var(--pink)}
#hm i:nth-child(1),#km i:nth-child(1){transform:translate(-8px,-14px) rotate(-45deg)}
#hm i:nth-child(2),#km i:nth-child(2){transform:translate(6px,-14px) rotate(45deg)}
#hm i:nth-child(3),#km i:nth-child(3){transform:translate(-8px,4px) rotate(45deg)}
#hm i:nth-child(4),#km i:nth-child(4){transform:translate(6px,4px) rotate(-45deg)}
#combow{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);text-align:center;opacity:0}
#cval{font-family:var(--fn);font-weight:700;font-size:29px;color:var(--pink);text-shadow:0 0 14px rgba(255,77,141,.9);line-height:1}
#combow .lbl{color:var(--pink2)}
#ctrack{width:62px;height:3px;background:rgba(255,77,141,.2);margin:4px auto 0}
#cbar{height:100%;width:100%;background:var(--pink)}
#ddir{position:absolute;left:50%;top:50%;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:4px solid transparent;border-top-color:var(--red);opacity:0}
